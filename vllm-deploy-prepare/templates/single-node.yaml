# 单机部署 - 标准 Kubernetes Deployment
# 适用于单个节点部署 vLLM 推理服务

---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    app: vllm-deploy
    model: ${MODEL_RESOURCE_NAME}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: ${NAMESPACE}
data:
  MODEL_PATH: "${MODEL_PATH}"
  MAX_MODEL_LEN: "${MAX_MODEL_LEN}"
  MAX_NUM_SEQS: "${MAX_NUM_SEQS}"
  TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-scripts
  namespace: ${NAMESPACE}
data:
  detect-npu.sh: |
    #!/bin/bash
    set -e
    echo "=== Container NPU Detection ===" >&2
    NPU_DEVICES=""
    for i in $(seq 0 15); do
      if [ -e "/dev/davinci$i" ]; then
        NPU_DEVICES="$NPU_DEVICES /dev/davinci$i"
      fi
    done
    DETECTED_NPU_COUNT=$(echo "$NPU_DEVICES" | wc -w)
    echo "NPU Count: $DETECTED_NPU_COUNT" >&2
    cat <<EOF
{"pod_name": "${HOSTNAME:-unknown}", "npu_count": $DETECTED_NPU_COUNT}
EOF

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-${MODEL_RESOURCE_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: vllm-deploy
    model: ${MODEL_RESOURCE_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-deploy
      model: ${MODEL_RESOURCE_NAME}
  progressDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: vllm-deploy
        model: ${MODEL_RESOURCE_NAME}
    spec:
      containers:
      - name: vllm
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command:
        - /bin/bash
        - -c
        - |
          # 等待用户手动执行 deploy.sh（Phase 11）
          echo "Pod ready. Waiting for deploy.sh execution..."
          echo "Run: kubectl cp deploy.sh -n ${NAMESPACE} <pod-name>:/tmp/deploy.sh"
          echo "Then: kubectl exec -n ${NAMESPACE} <pod-name> -- bash /tmp/deploy.sh"
          tail -f /dev/null
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HCCL_IF_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        ports:
        - name: http
          containerPort: 8000
        resources:
          limits:
            cpu: "${CPU_LIMIT}"
            memory: "${MEMORY_LIMIT}"
            ${NPU_RESOURCE_TYPE}: "${NPU_COUNT}"
          requests:
            cpu: "${CPU_REQUEST}"
            memory: "${MEMORY_REQUEST}"
            ${NPU_RESOURCE_TYPE}: "${NPU_COUNT}"
        volumeMounts:
        - name: model-storage
          mountPath: ${MODEL_MOUNT_PATH}
        - name: hccn-config
          mountPath: /etc/hccn.conf
          readOnly: true
        - name: shared-memory
          mountPath: /dev/shm
        - name: vllm-scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: model-storage
        hostPath:
          path: ${MODEL_PATH_HOST}
          type: Directory
      - name: hccn-config
        hostPath:
          path: /etc/hccn.conf
          type: File
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: ${SHM_SIZE_LIMIT}
      - name: vllm-scripts
        configMap:
          name: vllm-scripts
          defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: ${NAMESPACE}
spec:
  type: NodePort
  selector:
    app: vllm-deploy
    model: ${MODEL_RESOURCE_NAME}
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: ${SERVICE_PORT}
