# 主备部署 - 高可用配置
# Active-Standby 模式，确保服务高可用
# 使用 PodDisruptionBudget 和多副本策略

---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    app: vllm-deploy
    model: ${MODEL_NAME}
    deploy-mode: ha-active-standby

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: ${NAMESPACE}
data:
  MODEL_PATH: "${MODEL_PATH}"
  MAX_MODEL_LEN: "${MAX_MODEL_LEN}"
  MAX_NUM_SEQS: "${MAX_NUM_SEQS}"
  TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-scripts
  namespace: ${NAMESPACE}
data:
  detect-npu.sh: |
    #!/bin/bash
    set -e
    echo "=== Container NPU Detection ===" >&2
    NPU_DEVICES=""
    for i in $(seq 0 15); do
      if [ -e "/dev/davinci$i" ]; then
        NPU_DEVICES="$NPU_DEVICES /dev/davinci$i"
      fi
    done
    NPU_COUNT=$(echo "$NPU_DEVICES" | wc -w)
    echo "NPU Count: $NPU_COUNT" >&2
    cat <<EOF
{"pod_name": "${HOSTNAME:-unknown}", "npu_count": $NPU_COUNT}
EOF
  deploy.sh: |
    #!/bin/bash
    set -e
    vllm serve ${MODEL_PATH} \
      --served-model-name ${MODEL_NAME} \
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE} \
      --max-model-len ${MAX_MODEL_LEN} \
      --max-num-seqs ${MAX_NUM_SEQS} \
      --port 8000 \
      --trust-remote-code

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-${MODEL_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: vllm-deploy
    model: ${MODEL_NAME}
spec:
  replicas: ${HA_REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vllm-deploy
      model: ${MODEL_NAME}
  progressDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: vllm-deploy
        model: ${MODEL_NAME}
    spec:
      affinity:
        # Pod 反亲和性 - 确保副本分布在不同节点
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vllm-deploy
                    model: ${MODEL_NAME}
                topologyKey: kubernetes.io/hostname
        # 节点亲和性 - 优先选择有 NPU 的节点
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: ${NPU_NODE_LABEL}
                  operator: Exists
      containers:
      - name: vllm
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - vllm
        - serve
        - ${MODEL_PATH}
        - --served-model-name
        - ${MODEL_NAME}
        - --tensor-parallel-size
        - "${TENSOR_PARALLEL_SIZE}"
        - --max-model-len
        - "${MAX_MODEL_LEN}"
        - --max-num-seqs
        - "${MAX_NUM_SEQS}"
        - --port
        - "8000"
        - --trust-remote-code
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HCCL_IF_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 10
          failureThreshold: 3
        resources:
          limits:
            cpu: "${CPU_LIMIT}"
            memory: "${MEMORY_LIMIT}"
            ${NPU_RESOURCE_TYPE}: "${NPU_COUNT}"
          requests:
            cpu: "${CPU_REQUEST}"
            memory: "${MEMORY_REQUEST}"
            ${NPU_RESOURCE_TYPE}: "${NPU_COUNT}"
        volumeMounts:
        - name: model-storage
          mountPath: ${MODEL_MOUNT_PATH}
        - name: hccn-config
          mountPath: /etc/hccn.conf
          readOnly: true
        - name: shared-memory
          mountPath: /dev/shm
        - name: vllm-scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: model-storage
        hostPath:
          path: ${MODEL_PATH_HOST}
          type: Directory
      - name: hccn-config
        hostPath:
          path: /etc/hccn.conf
          type: File
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: vllm-scripts
        configMap:
          name: vllm-scripts
          defaultMode: 0755
      terminationGracePeriodSeconds: 60

---
# PodDisruptionBudget - 确保滚动更新时至少有一个 Pod 可用
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm-${MODEL_NAME}-pdb
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vllm-deploy
      model: ${MODEL_NAME}

---
# Service - 负载均衡到健康的 Pod
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: ${NAMESPACE}
spec:
  type: NodePort
  selector:
    app: vllm-deploy
    model: ${MODEL_NAME}
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: ${SERVICE_PORT}

---
# HorizontalPodAutoscaler (可选) - 自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-${MODEL_NAME}-hpa
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-${MODEL_NAME}
  minReplicas: ${HA_MIN_REPLICAS}
  maxReplicas: ${HA_MAX_REPLICAS}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60