# PD 分离部署 - Kthena CRD 版本
# 使用 Volcano Kthena 的 ModelServing、ModelServer、ModelRoute
# 适用于华为昇腾 NPU 环境

---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    app: vllm-deploy
    model: ${MODEL_NAME}
    deploy-mode: pd-kthena

---
# ModelServing - PD 分离工作负载定义
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: ${MODEL_NAME}
  namespace: ${NAMESPACE}
spec:
  schedulerName: volcano
  replicas: 1
  recoveryPolicy: ServingGroupRecreate
  template:
    restartGracePeriodSeconds: 60
    roles:
      # Prefill 角色 (KV Producer)
      - name: prefill
        replicas: ${PREFILL_REPLICAS}
        entryTemplate:
          spec:
            initContainers:
              - name: downloader
                imagePullPolicy: Always
                image: ghcr.io/volcano-sh/downloader:latest
                args:
                  - --source
                  - ${MODEL_SOURCE}
                  - --output-dir
                  - ${MODEL_MOUNT_PATH}/
                volumeMounts:
                  - name: models
                    mountPath: ${MODEL_MOUNT_PATH}/
            containers:
              - name: runtime
                image: ghcr.io/volcano-sh/runtime:latest
                ports:
                  - containerPort: 8100
                args:
                  - --port
                  - "8100"
                  - --engine
                  - vllm
                  - --pod
                  - $(POD_NAME).$(NAMESPACE)
                  - --model
                  - ${MODEL_NAME}
                  - --engine-base-url
                  - http://localhost:8000
              - name: vllm
                image: ${IMAGE}
                ports:
                  - containerPort: 8000
                env:
                  - name: HF_HUB_OFFLINE
                    value: "1"
                  - name: HCCL_IF_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: GLOO_SOCKET_IFNAME
                    value: "eth0"
                  - name: TP_SOCKET_IFNAME
                    value: "eth0"
                  - name: HCCL_SOCKET_IFNAME
                    value: "eth0"
                  - name: VLLM_LOGGING_LEVEL
                    value: DEBUG
                  - name: AscendRealDevices
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.annotations['huawei.com/AscendReal']
                args:
                  - "${MODEL_PATH}"
                  - "--served-model-name"
                  - "${MODEL_NAME}"
                  - "--tensor-parallel-size"
                  - "${PREFILL_TP_SIZE}"
                  - "--gpu-memory-utilization"
                  - "0.8"
                  - "--max-model-len"
                  - "${MAX_MODEL_LEN}"
                  - "--max-num-batched-tokens"
                  - "${MAX_MODEL_LEN}"
                  - "--trust-remote-code"
                  - "--enforce-eager"
                  - "--kv-transfer-config"
                  - '{"kv_connector":"MooncakeConnectorV1","kv_buffer_device":"npu","kv_role":"kv_producer","kv_parallel_size":1,"kv_port":"20001","engine_id":"0","kv_rank":0}'
                imagePullPolicy: Always
                resources:
                  limits:
                    cpu: "${CPU_LIMIT}"
                    memory: ${MEMORY_LIMIT}
                    ${NPU_RESOURCE_TYPE}: "${PREFILL_NPU_COUNT}"
                  requests:
                    cpu: "${CPU_REQUEST}"
                    memory: ${MEMORY_LIMIT}
                    ${NPU_RESOURCE_TYPE}: "${PREFILL_NPU_COUNT}"
                readinessProbe:
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 8000
                livenessProbe:
                  initialDelaySeconds: 900
                  periodSeconds: 5
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 8000
                volumeMounts:
                  - name: models
                    mountPath: ${MODEL_MOUNT_PATH}/
                    readOnly: true
                  - name: hccn-config
                    mountPath: /etc/hccn.conf
                    readOnly: true
                  - name: shared-memory-volume
                    mountPath: /dev/shm
            volumes:
              - name: models
                hostPath:
                  path: ${MODEL_PATH_HOST}
                  type: DirectoryOrCreate
              - name: hccn-config
                hostPath:
                  path: /etc/hccn.conf
                  type: File
              - name: shared-memory-volume
                emptyDir:
                  sizeLimit: 256Mi
                  medium: Memory

      # Decode 角色 (KV Consumer)
      - name: decode
        replicas: ${DECODE_REPLICAS}
        entryTemplate:
          spec:
            initContainers:
              - name: downloader
                imagePullPolicy: Always
                image: ghcr.io/volcano-sh/downloader:latest
                args:
                  - --source
                  - ${MODEL_SOURCE}
                  - --output-dir
                  - ${MODEL_MOUNT_PATH}/
                volumeMounts:
                  - name: models
                    mountPath: ${MODEL_MOUNT_PATH}/
            containers:
              - name: vllm
                image: ${IMAGE}
                ports:
                  - containerPort: 8000
                env:
                  - name: HF_HUB_OFFLINE
                    value: "1"
                  - name: HCCL_IF_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: GLOO_SOCKET_IFNAME
                    value: "eth0"
                  - name: TP_SOCKET_IFNAME
                    value: "eth0"
                  - name: HCCL_SOCKET_IFNAME
                    value: "eth0"
                  - name: VLLM_LOGGING_LEVEL
                    value: DEBUG
                  - name: AscendRealDevices
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.annotations['huawei.com/AscendReal']
                args:
                  - "${MODEL_PATH}"
                  - "--served-model-name"
                  - "${MODEL_NAME}"
                  - "--tensor-parallel-size"
                  - "${DECODE_TP_SIZE}"
                  - "--gpu-memory-utilization"
                  - "0.8"
                  - "--max-model-len"
                  - "${MAX_MODEL_LEN}"
                  - "--max-num-batched-tokens"
                  - "${DECODE_MAX_BATCHED_TOKENS}"
                  - "--trust-remote-code"
                  - "--no-enable-prefix-caching"
                  - "--enforce-eager"
                  - "--kv-transfer-config"
                  - '{"kv_connector":"MooncakeConnectorV1","kv_buffer_device":"npu","kv_role":"kv_consumer","kv_parallel_size":1,"kv_port":"20002","engine_id":"1","kv_rank":1}'
                imagePullPolicy: Always
                resources:
                  limits:
                    cpu: "${CPU_LIMIT}"
                    memory: ${MEMORY_LIMIT}
                    ${NPU_RESOURCE_TYPE}: "${DECODE_NPU_COUNT}"
                  requests:
                    cpu: "${CPU_REQUEST}"
                    memory: ${MEMORY_LIMIT}
                    ${NPU_RESOURCE_TYPE}: "${DECODE_NPU_COUNT}"
                readinessProbe:
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 8000
                livenessProbe:
                  initialDelaySeconds: 900
                  periodSeconds: 5
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 8000
                volumeMounts:
                  - name: models
                    mountPath: ${MODEL_MOUNT_PATH}/
                    readOnly: true
                  - name: hccn-config
                    mountPath: /etc/hccn.conf
                    readOnly: true
                  - name: shared-memory-volume
                    mountPath: /dev/shm
            volumes:
              - name: models
                hostPath:
                  path: ${MODEL_PATH_HOST}
                  type: DirectoryOrCreate
              - name: hccn-config
                hostPath:
                  path: /etc/hccn.conf
                  type: File
              - name: shared-memory-volume
                emptyDir:
                  sizeLimit: 256Mi
                  medium: Memory

---
# ModelServer - PD 分组管理
apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelServer
metadata:
  name: ${MODEL_NAME}-server
  namespace: ${NAMESPACE}
spec:
  kvConnector:
    type: mooncake
  workloadSelector:
    matchLabels:
      modelserving.volcano.sh/name: ${MODEL_NAME}
    pdGroup:
      groupKey: "modelserving.volcano.sh/group-name"
      prefillLabels:
        modelserving.volcano.sh/role: prefill
      decodeLabels:
        modelserving.volcano.sh/role: decode
  workloadPort:
    port: 8000
  model: "${MODEL_NAME}"
  inferenceEngine: "vLLM"
  trafficPolicy:
    timeout: 10s

---
# ModelRoute - 用户端点
apiVersion: networking.serving.volcano.sh/v1alpha1
kind: ModelRoute
metadata:
  name: ${MODEL_NAME}-route
  namespace: ${NAMESPACE}
spec:
  modelName: "${MODEL_NAME}"
  rules:
    - name: "default"
      targetModels:
        - modelServerName: "${MODEL_NAME}-server"