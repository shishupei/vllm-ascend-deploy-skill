# 多机分布式部署 - 单文件备选模板
# 包含 Namespace、ConfigMaps、Master/Worker Deployments 和 Service
# 使用 Ray 作为分布式后端
#
# 注意：此模板为单文件备选方案，适用于快速测试或小规模部署。
# 生产环境推荐使用拆分模板 multi-node-master.yaml + multi-node-worker.yaml，
# 以获得更灵活的节点分配和 Worker 扩缩容能力。
# 变量命名与拆分模板保持一致，均可通过 fill-template.sh 填充。

---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    app: vllm-deploy
    model: ${MODEL_RESOURCE_NAME}
    deploy-mode: multi-node

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: ${NAMESPACE}
data:
  MODEL_PATH: "${MODEL_PATH}"
  MAX_MODEL_LEN: "${MAX_MODEL_LEN}"
  MAX_NUM_SEQS: "${MAX_NUM_SEQS}"
  TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE}"
  WORLD_SIZE: "${WORLD_SIZE}"
  MASTER_ADDR: "${MASTER_NODE_IP}"
  MASTER_PORT: "${MASTER_PORT}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-scripts
  namespace: ${NAMESPACE}
data:
  detect-npu.sh: |
    #!/bin/bash
    set -e
    echo "=== Container NPU Detection ===" >&2
    NPU_DEVICES=""
    for i in $(seq 0 15); do
      if [ -e "/dev/davinci$i" ]; then
        NPU_DEVICES="$NPU_DEVICES /dev/davinci$i"
      fi
    done
    DETECTED_NPU_COUNT=$(echo "$NPU_DEVICES" | wc -w)
    echo "NPU Count: $DETECTED_NPU_COUNT" >&2
    cat <<EOF
{"pod_name": "${HOSTNAME:-unknown}", "npu_count": $DETECTED_NPU_COUNT}
EOF

---
# Master 节点 Deployment (Rank 0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-${MODEL_RESOURCE_NAME}-master
  namespace: ${NAMESPACE}
  labels:
    app: vllm-deploy
    model: ${MODEL_RESOURCE_NAME}
    role: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-deploy
      model: ${MODEL_RESOURCE_NAME}
      role: master
  progressDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: vllm-deploy
        model: ${MODEL_RESOURCE_NAME}
        role: master
    spec:
      nodeName: ${MASTER_NODE_NAME}
      hostNetwork: true
      containers:
      - name: vllm
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command:
        - /bin/bash
        - -c
        - |
          # Ray 集群引导 - Master 节点启动 head
          ray start --head --port="${MASTER_PORT}" --node-ip-address="${HCCL_IF_IP}"
          # 等待用户手动执行 deploy.sh
          echo "Ray cluster initialized. Waiting for deploy.sh execution..."
          tail -f /dev/null
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HCCL_IF_IP
          value: "${MASTER_NODE_IP}"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: TP_SOCKET_IFNAME
          value: "eth0"
        - name: HCCL_SOCKET_IFNAME
          value: "eth0"
        - name: RANK
          value: "0"
        - name: WORLD_SIZE
          value: "${WORLD_SIZE}"
        - name: MASTER_ADDR
          value: "${MASTER_NODE_IP}"
        - name: MASTER_PORT
          value: "${MASTER_PORT}"
        ports:
        - name: http
          containerPort: 8000
        - name: ray
          containerPort: ${MASTER_PORT}
        resources:
          limits:
            cpu: "${CPU_LIMIT}"
            memory: "${MEMORY_LIMIT}"
            ${NPU_RESOURCE_TYPE}: "${NPU_COUNT_PER_NODE}"
          requests:
            cpu: "${CPU_REQUEST}"
            memory: "${MEMORY_REQUEST}"
            ${NPU_RESOURCE_TYPE}: "${NPU_COUNT_PER_NODE}"
        volumeMounts:
        - name: model-storage
          mountPath: ${MODEL_MOUNT_PATH}
        - name: hccn-config
          mountPath: /etc/hccn.conf
          readOnly: true
        - name: shared-memory
          mountPath: /dev/shm
        - name: vllm-scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: model-storage
        hostPath:
          path: ${MODEL_PATH_HOST}
          type: Directory
      - name: hccn-config
        hostPath:
          path: /etc/hccn.conf
          type: File
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: ${SHM_SIZE_LIMIT}
      - name: vllm-scripts
        configMap:
          name: vllm-scripts
          defaultMode: 0755

---
# Worker 节点 Deployment (Rank 1-N)
# 每个节点需要单独创建 Deployment，替换 ${WORKER_RANK} 和 ${WORKER_NODE_NAME}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-${MODEL_RESOURCE_NAME}-worker-${WORKER_RANK}
  namespace: ${NAMESPACE}
  labels:
    app: vllm-deploy
    model: ${MODEL_RESOURCE_NAME}
    role: worker
    rank: "${WORKER_RANK}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-deploy
      model: ${MODEL_RESOURCE_NAME}
      role: worker
      rank: "${WORKER_RANK}"
  progressDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: vllm-deploy
        model: ${MODEL_RESOURCE_NAME}
        role: worker
        rank: "${WORKER_RANK}"
    spec:
      nodeName: ${WORKER_NODE_NAME}
      hostNetwork: true
      containers:
      - name: vllm
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command:
        - /bin/bash
        - -c
        - |
          # Ray 集群引导 - Worker 节点连接到 head
          ray start --address="${MASTER_NODE_IP}":"${MASTER_PORT}" --node-ip-address="${HCCL_IF_IP}"
          # 等待用户手动执行 deploy.sh
          echo "Ray worker connected. Waiting for deploy.sh execution..."
          tail -f /dev/null
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HCCL_IF_IP
          value: "${WORKER_NODE_IP}"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: TP_SOCKET_IFNAME
          value: "eth0"
        - name: HCCL_SOCKET_IFNAME
          value: "eth0"
        - name: RANK
          value: "${WORKER_RANK}"
        - name: WORLD_SIZE
          value: "${WORLD_SIZE}"
        - name: MASTER_ADDR
          value: "${MASTER_NODE_IP}"
        - name: MASTER_PORT
          value: "${MASTER_PORT}"
        ports:
        - name: http
          containerPort: 8000
        - name: ray
          containerPort: ${MASTER_PORT}
        resources:
          limits:
            cpu: "${CPU_LIMIT}"
            memory: "${MEMORY_LIMIT}"
            ${NPU_RESOURCE_TYPE}: "${NPU_COUNT_PER_NODE}"
          requests:
            cpu: "${CPU_REQUEST}"
            memory: "${MEMORY_REQUEST}"
            ${NPU_RESOURCE_TYPE}: "${NPU_COUNT_PER_NODE}"
        volumeMounts:
        - name: model-storage
          mountPath: ${MODEL_MOUNT_PATH}
        - name: hccn-config
          mountPath: /etc/hccn.conf
          readOnly: true
        - name: shared-memory
          mountPath: /dev/shm
        - name: vllm-scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: model-storage
        hostPath:
          path: ${MODEL_PATH_HOST}
          type: Directory
      - name: hccn-config
        hostPath:
          path: /etc/hccn.conf
          type: File
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: ${SHM_SIZE_LIMIT}
      - name: vllm-scripts
        configMap:
          name: vllm-scripts
          defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: ${NAMESPACE}
spec:
  type: NodePort
  selector:
    app: vllm-deploy
    model: ${MODEL_RESOURCE_NAME}
    role: master
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: ${SERVICE_PORT}
