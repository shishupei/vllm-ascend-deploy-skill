apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${MODEL_NAME}-${NODE_NAME}
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${MODEL_NAME}
      app.kubernetes.io/node: ${NODE_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${MODEL_NAME}
        app.kubernetes.io/node: ${NODE_NAME}
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${NODE_NAME}
      containers:
        - name: ${MODEL_NAME}
          image: ${IMAGE}
          resources:
            limits:
              ${NPU_RESOURCE_TYPE}: ${NPU_COUNT}
          volumeMounts:
            - name: model-volume
              mountPath: ${MODEL_MOUNT_PATH}
      volumes:
        - name: model-volume
          hostPath:
            path: ${MODEL_PATH_HOST}